name: Deploy to Hostinger

on:
  push:
    branches:
      - v2-new-design

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.HOSTINGER_PORT }}

          # Local build folder
          local-dir: ./dist/

          # Root of public_html
          server-dir: ./

          # Use a fresh state file to bypass 550 deletion errors for manually deleted server folders
          state-name: .ftp-deploy-sync-state-v2.json

          # Never touch these folders/files
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            page/**